---
name: PyPI release

# yamllint disable-line rule:truthy
on:
  push:
    # Only invoked on release tag pushes
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Enter the Git tag to build (e.g., v1.2.3)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Configure Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv

      - name: Check whether release already exists on PyPI
        id: pypi-release-check
        run: |
          PACKAGE_NAME=grpc_robot
          PACKAGE_VERSION=$(tr -d '\r\n' < VERSION)

          python - "$PACKAGE_NAME" "$PACKAGE_VERSION" <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          package_name = sys.argv[1]
          package_version = sys.argv[2]
          url = f"https://pypi.org/pypi/{package_name}/json"

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  releases = json.load(response).get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  releases = {}
              else:
                  raise
          except urllib.error.URLError as exc:
              print(f"Unable to query {url}: {exc}. Continuing with publish.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("should-publish=true\n")
              raise SystemExit(0)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if package_version in releases:
                  print(
                      f"Release {package_name}=={package_version} already exists on PyPI; skipping publish."
                  )
                  output.write("should-publish=false\n")
              else:
                  print(f"Release {package_name}=={package_version} not found on PyPI; continuing.")
                  output.write("should-publish=true\n")
          PY

      - name: Build package distribution files
        if: steps.pypi-release-check.outputs.should-publish == 'true'
        uses: opencord/shared-workflows/.github/actions/pypi-publish-action@main
        with:
          pypi-username: ${{ secrets.PYPI_USERNAME }}
          pypi-password: ${{ secrets.PYPI_PASSWORD }}
